name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"              # use a mesma major do projeto
          check-latest: true

      - name: Enable Corepack & pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@3.5.1 --activate
          yarn -v
          node -v

      - name: Cache Yarn Berry
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies (strict)
        run: yarn install --immutable --immutable-cache

      # Se precisar buildar o client
      - name: Build client
        run: yarn workspace client build
        if: ${{ hashFiles('packages/client/**') != '' }}

      # Se tiver server
      - name: Build server
        run: yarn workspace server build
        if: ${{ hashFiles('packages/server/**') != '' }}

      # Exemplo opcional: testes
      - name: Test
        run: yarn test --ci --reporters=default

