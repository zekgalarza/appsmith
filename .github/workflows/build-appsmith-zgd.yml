name: Build Appsmith CE - Zek Galarza Dashboard
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Yarn
        run: npm i -g yarn

      # Build do client (frontend)
      - name: Build client
        working-directory: app/client
        run: |
          yarn install
          yarn build

      # Build do server (backend)
      - name: Build server
        working-directory: app/server
        run: |
          mvn -B clean compile
          ./build.sh -DskipTests

      # Login no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build + push imagem CE
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/appsmith-dashboard:latest
