
name: Build Appsmith CE - Zek Galarza Dashboard
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # aumenta memória do Node
      NODE_OPTIONS: --max_old_space_size=4096
      # memória pro Maven (opcional)
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # libera espaço no runner (evita erro por disco cheio)
      - name: Free disk space (optional but helpful)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: app/client/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Install Yarn
        run: npm i -g yarn

      # ---------- IMPORTANTE: build do RTS antes de client/server ----------
      - name: Build RTS
        run: |
         yarn --cwd app/client/packages/rts install
         yarn --cwd app/client/packages/rts build


      # ---------- Client (frontend) ----------
      - name: Build client
        working-directory: app/client
        run: |
          yarn install --frozen-lockfile
          yarn build

      # ---------- Server (backend) ----------
      - name: Build server
        working-directory: app/server
        run: |
          mvn -B clean compile
          chmod +x ./build.sh
          ./build.sh -DskipTests

      # ---------- Docker: login com SECRETS ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Buildx (mais estável p/ build e push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Docker build + push ----------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appsmith-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appsmith-dashboard:${{ github.sha }}
