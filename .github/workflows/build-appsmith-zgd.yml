name: Build Appsmith CE - Zek Galarza Dashboard
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      MAVEN_OPTS: -Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack & Yarn 3.5.1 (global)
        run: |
          corepack enable
          corepack prepare yarn@3.5.1 --activate
          yarn -v

      # --- DEBUG: ver estrutura e arquivos do client ---
      - name: Debug layout
        run: |
          pwd
          ls -la
          echo "--- app/client ---"
          ls -la app/client || true
          echo "--- package.json (top 60) ---"
          head -n 60 app/client/package.json || true
          echo "--- .yarnrc.yml ---"
          cat app/client/.yarnrc.yml || true

      # --- GARANTIR Yarn 3.5.1 DENTRO DO PROJETO client ---
      - name: Pin Yarn inside project (client)
        working-directory: app/client
        run: |
          corepack use yarn@3.5.1
          yarn -v
          # cria .yarnrc.yml mínima, se não existir
          if [ ! -f .yarnrc.yml ]; then
            cat > .yarnrc.yml <<'YRC'
nodeLinker: node-modules
enableGlobalCache: true
yarnPath: .yarn/releases/yarn-3.5.1.cjs
YRC
          fi
          # garante o binário do yarn no projeto
          yarn set version 3.5.1
          git status --porcelain || true

      # === CLIENT ===
      - name: Install client deps
        working-directory: app/client
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          yarn install

      - name: Build client
        working-directory: app/client
        run: yarn build

      # === SERVER ===
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build server
        working-directory: app/server
        run: |
          mvn -B clean compile
          chmod +x ./build.sh
          ./build.sh -DskipTests

      # === DOCKER ===
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appsmith-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appsmith-dashboard:${{ github.sha }}
